<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170" role="img" aria-label="Animated cat, bird, butterfly and snail" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .blink { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    .ground { stroke: #8b95a5; stroke-width: 2; stroke-dasharray: 2 10; stroke-linecap: round; }
    .grass { stroke: #5fb36b; stroke-width: 2.5; stroke-linecap: round; fill: none; }
    .meow { font: 600 13px sans-serif; fill: #8b95a5; }
  </style>

  <!-- ground + grass -->
  <line class="ground" x1="10" y1="136" x2="790" y2="136"/>
  <path class="grass" d="M90 136 l-3 -10 M95 136 l0 -13 M100 136 l3 -10"/>
  <path class="grass" d="M300 136 l-3 -10 M305 136 l0 -13 M310 136 l3 -10"/>
  <path class="grass" d="M700 136 l-3 -10 M705 136 l0 -13 M710 136 l3 -10"/>

  <!-- cat -->
  <g transform="translate(600 0)">
    <path d="M28 122 Q60 112 52 82" stroke="#f4a259" stroke-width="9" fill="none" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" values="-14 28 122;22 28 122;-14 28 122" dur="1.3s" repeatCount="indefinite"/>
    </path>
    <ellipse cx="0" cy="110" rx="30" ry="26" fill="#f4a259"/>
    <ellipse cx="-12" cy="132" rx="9" ry="4" fill="#f4a259"/>
    <ellipse cx="12" cy="132" rx="9" ry="4" fill="#f4a259"/>
    <polygon points="-21,60 -19,36 -4,54" fill="#f4a259"/>
    <polygon points="21,60 19,36 4,54" fill="#f4a259"/>
    <polygon points="-17,55 -17,44 -9,53" fill="#f7b7c0"/>
    <polygon points="17,55 17,44 9,53" fill="#f7b7c0"/>
    <circle cx="0" cy="72" r="23" fill="#f4a259"/>
    <ellipse class="blink" cx="-9" cy="70" rx="2.6" ry="3.6" fill="#2b2b2b"/>
    <ellipse class="blink" cx="9" cy="70" rx="2.6" ry="3.6" fill="#2b2b2b"/>
    <polygon points="-2.5,77 2.5,77 0,80.5" fill="#e87d90"/>
    <path d="M0 80.5 q-3 3 -6 1 M0 80.5 q3 3 6 1" stroke="#2b2b2b" stroke-width="1" fill="none"/>
    <path d="M-12 78 l-14 -2 M-12 81 l-14 3 M12 78 l14 -2 M12 81 l14 3" stroke="#2b2b2b" stroke-width="1" opacity=".5"/>
    <text class="meow" x="-62" y="44">meow~
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.4;.5;.7;.8;1" dur="7s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- bird flying across -->
  <g>
    <animateMotion dur="16s" repeatCount="indefinite" path="M-40,48 C180,10 380,80 560,36 C680,10 760,40 860,28"/>
    <ellipse cx="0" cy="0" rx="11" ry="6.5" fill="#4aa3df"/>
    <circle cx="11" cy="-3" r="4.5" fill="#4aa3df"/>
    <polygon points="14.5,-4 21,-2.5 14.5,-1" fill="#f4b942"/>
    <circle cx="12.5" cy="-4" r="1" fill="#2b2b2b"/>
    <path fill="#2f80c0" d="M-2 -2 Q-8 -20 -20 -15 Q-9 -7 -2 -2 Z">
      <animate attributeName="d" dur=".45s" repeatCount="indefinite"
        values="M-2 -2 Q-8 -20 -20 -15 Q-9 -7 -2 -2 Z;M-2 -2 Q-8 10 -20 14 Q-9 5 -2 -2 Z;M-2 -2 Q-8 -20 -20 -15 Q-9 -7 -2 -2 Z"/>
    </path>
  </g>

  <!-- butterfly -->
  <g>
    <animateMotion dur="10s" repeatCount="indefinite" path="M230,92 C280,60 340,112 390,84 C430,62 380,30 330,56 C280,82 200,104 230,92 Z"/>
    <ellipse cx="-5" cy="-2" rx="6" ry="8" fill="#e56ba8">
      <animate attributeName="rx" values="6;1;6" dur=".5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="5" cy="-2" rx="6" ry="8" fill="#e56ba8">
      <animate attributeName="rx" values="6;1;6" dur=".5s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-1" y="-7" width="2" height="14" rx="1" fill="#2b2b2b"/>
  </g>

  <!-- snail crawling -->
  <g>
    <animateMotion dur="42s" repeatCount="indefinite" path="M30,136 L500,136"/>
    <ellipse cx="2" cy="-4" rx="16" ry="4.5" fill="#c9b79c"/>
    <circle cx="-3" cy="-13" r="10" fill="#d98c5f"/>
    <path d="M-3 -13 m0 0 a2 2 0 1 1 3 2 a5 5 0 1 1 -7 -4 a8 8 0 1 1 11 7" stroke="#a65f35" stroke-width="1.3" fill="none"/>
    <circle cx="16" cy="-8" r="3.6" fill="#c9b79c"/>
    <path d="M15 -11 l-1 -9 M18 -11 l3 -8" stroke="#c9b79c" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="14" cy="-20" r="1.6" fill="#2b2b2b"/>
    <circle cx="21" cy="-20" r="1.6" fill="#2b2b2b"/>
  </g>
</svg>
